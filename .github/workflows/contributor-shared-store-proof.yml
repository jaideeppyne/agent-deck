name: Contributor shared-store proof (fork only)
on:
  push:
    branches: ['verify/shared-projects-*']
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated verification image
        run: docker build -t agentdeck-shared-proof -f .verification/Dockerfile .verification
      - name: Build affected binary and observe test-first failure
        run: |
          mkdir proof
          docker run --rm --mount type=bind,src="$PWD",dst=/src,readonly \
            --mount type=bind,src="$PWD/proof",dst=/proof \
            -e HOME=/tmp/home -e AGENTDECK_TEST_CONTAINER=1 \
            -e AGENTDECK_TELEMETRY=0 -e AGENTDECK_SKIP_UPDATE_CHECK=1 \
            agentdeck-shared-proof bash -c '
              set -eu
              mkdir -p "$HOME"
              cp -R /src /tmp/src
              cd /tmp/src
              go version
              git rev-parse HEAD
              git worktree add /tmp/fixed 7831796b53d8eb9d093ab42a0206465bdf3c29f9
              git worktree add /tmp/base 036915808f43363ca9d54e77ce1fc0706b82029c
              cp /tmp/fixed/internal/session/shared_projects_store_test.go /tmp/base/internal/session/
              cp /tmp/fixed/cmd/agent-deck/shared_projects_store_test.go /tmp/base/cmd/agent-deck/
              cd /tmp/base
              go vet ./...
              go build -o /proof/agent-deck-old ./cmd/agent-deck
              set +e
              go test -v -count=1 -run "TestSwitchSharedProjectsStore|TestMigrateSharedProjectsStoreIsNoOp|TestSessionSwitchAccount_SharedProjectsStore" ./internal/session ./cmd/agent-deck > /proof/regression-old.log 2>&1
              rc=$?
              set -e
              cat /proof/regression-old.log
              echo "$rc" > /proof/regression-old-exit.txt
              test "$rc" -eq 1
              grep -q "already-shared store refused" /proof/regression-old.log
              ! grep -q "build failed" /proof/regression-old.log
              cd /tmp/fixed
              go vet ./...
              go build -o /proof/agent-deck-fixed ./cmd/agent-deck
              set +e
              go test -v -count=1 -run "TestSwitchSharedProjectsStore|TestMigrateSharedProjectsStoreIsNoOp|TestSessionSwitchAccount_SharedProjectsStore" ./internal/session ./cmd/agent-deck > /proof/regression-fixed.log 2>&1
              rc=$?
              set -e
              cat /proof/regression-fixed.log
              echo "$rc" > /proof/regression-fixed-exit.txt
              test "$rc" -eq 0
              set +e
              FULL_TESTS=1 BASE_REF=036915808f43363ca9d54e77ce1fc0706b82029c \
                .github/skills/agent-deck-contributor/scripts/self-check.sh /src/.verification/pr-body.md > /proof/self-check.log 2>&1
              rc=$?
              set -e
              cat /proof/self-check.log
              test "$rc" -eq 0
              grep -q "Ready to open" /proof/self-check.log
            '
      - name: Reproduce with real binary in offline container
        run: |
          image=$(docker image inspect agentdeck-shared-proof --format '{{.Id}}')
          set +e
          python3 skills/deck-repro/scripts/run.py --image "$image" --binary proof/agent-deck-old \
            --script .verification/repro.sh --fixtures .verification/fixtures --out proof/repro-old --timeout 120
          rc=$?
          set -e
          cat proof/repro-old/output.log
          test "$rc" -eq 1
          grep -q 'ORACLE: shared-store refusal reproduced' proof/repro-old/output.log
          python3 skills/deck-repro/scripts/run.py --image "$image" --binary proof/agent-deck-fixed \
            --script .verification/repro.sh --fixtures .verification/fixtures --out proof/repro-fixed --timeout 120
          cat proof/repro-fixed/output.log
          grep -q 'ORACLE: shared-store account switch succeeded without transcript changes' proof/repro-fixed/output.log
          sha256sum proof/agent-deck-old proof/agent-deck-fixed .verification/repro.sh .verification/fixtures/repro.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-store-fixed-proof
          path: |
            proof/*.log
            proof/*-exit.txt
            proof/repro-*/receipt.json
            proof/repro-*/output.log
            proof/repro-*/container.json
          retention-days: 7
  ci-checks:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7831796b53d8eb9d093ab42a0206465bdf3c29f9
          persist-credentials: false
      - name: Repository CI-equivalent verification
        run: |
          set -o pipefail
          make verify-docker 2>&1 | tee "$RUNNER_TEMP/verify-docker.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-store-ci-proof
          path: ${{ runner.temp }}/verify-docker.log
          retention-days: 7
