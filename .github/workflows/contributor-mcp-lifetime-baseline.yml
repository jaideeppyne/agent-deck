name: Contributor MCP proxy lifetime baseline (fork only)
on:
  push:
    branches: ['verify/mcp-proxy-lifetime-baseline']
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build real CLI and tests-only behavioral baseline in Docker
        run: |
          mkdir -p proof fixtures
          cp .verification/mcp/fixtures/repro.py fixtures/
          docker build -t mcp-lifetime-proof -f .verification/mcp/Dockerfile .verification/mcp
          image=$(docker image inspect mcp-lifetime-proof --format '{{.Id}}')
          docker run --rm --init --mount type=bind,src="$PWD",dst=/src,readonly \
            --mount type=bind,src="$PWD/proof",dst=/proof \
            -e PROOF_IMAGE_ID="$image" -e HOME=/tmp/build-home \
            -e AGENTDECK_TEST_CONTAINER=1 -e AGENTDECK_SKIP_UPDATE_CHECK=1 \
            mcp-lifetime-proof bash -c 'set -eu; mkdir -p "$HOME"; cp -R /src /tmp/src; cd /tmp/src; python3 .verification/mcp/baseline.py'
      - name: Real CLI EOF reconnect reproduction with network disabled
        run: |
          image=$(docker image inspect mcp-lifetime-proof --format '{{.Id}}')
          set +e
          python3 skills/deck-repro/scripts/run.py --image "$image" --binary proof/agent-deck-old \
            --script .verification/mcp/repro.sh --fixtures fixtures --out proof/repro-old --timeout 120
          rc=$?
          set -e
          cat proof/repro-old/output.log
          test "$rc" -eq 1
          grep -q 'ORACLE: live proxy reconnects after its client stdin EOF' proof/repro-old/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-lifetime-baseline
          path: |
            proof/regression-old/output.log
            proof/regression-old/receipt.json
            proof/pool-natural-exit-control.log
            proof/repro-old/output.log
            proof/repro-old/receipt.json
            proof/repro-old/container.json
          retention-days: 7
