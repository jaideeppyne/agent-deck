name: Contributor systemd private log baseline (fork only)
on:
  push:
    branches: ['verify/systemd-private-log-baseline']
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Published-head permissions expected-red in Docker
        run: |
          mkdir -p proof
          docker build -t systemd-private-proof -f .verification/systemd-review/Dockerfile .verification/systemd-review
          image=$(docker image inspect systemd-private-proof --format '{{.Id}}')
          docker run --rm --init --mount type=bind,src="$PWD",dst=/src,readonly \
            --mount type=bind,src="$PWD/proof",dst=/proof \
            -e PROOF_IMAGE_ID="$image" -e HOME=/tmp/build-home \
            -e AGENTDECK_TEST_CONTAINER=1 -e AGENTDECK_SKIP_UPDATE_CHECK=1 \
            systemd-private-proof bash -c 'set -eu; umask 022; mkdir -p "$HOME"; cp -R /src /tmp/src; cd /tmp/src; python3 .verification/systemd-review/baseline.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: systemd-private-baseline
          path: |
            proof/regression-old/output.log
            proof/regression-old/receipt.json
          retention-days: 7
