name: Contributor cross-profile baseline (fork only)
on:
  push:
    branches: ['verify/cross-profile-baseline']
permissions:
  contents: read
jobs:
  baseline:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated verification image
        run: docker build -t agentdeck-cross-profile -f .verification/Dockerfile .verification
      - name: Build original binary and observe behavioral regression failure
        run: |
          mkdir proof
          docker run --rm --init --mount type=bind,src="$PWD",dst=/src,readonly \
            --mount type=bind,src="$PWD/proof",dst=/proof \
            -e HOME=/tmp/home -e AGENTDECK_TEST_CONTAINER=1 \
            -e AGENTDECK_SKIP_UPDATE_CHECK=1 agentdeck-cross-profile bash -c '
              set -eu
              mkdir -p "$HOME"
              git clone --no-hardlinks /src /tmp/base
              cd /tmp/base
              git checkout 036915808f43363ca9d54e77ce1fc0706b82029c
              cp /src/cmd/agent-deck/cross_profile_account_test.go cmd/agent-deck/
              go version
              git rev-parse HEAD
              go vet ./...
              go build -o /proof/agent-deck-old ./cmd/agent-deck
              set +e
              go test -v -count=1 -run "^TestCrossProfile" ./cmd/agent-deck > /proof/regression-old.log 2>&1
              rc=$?
              set -e
              cat /proof/regression-old.log
              echo "$rc" > /proof/regression-old-exit.txt
              test "$rc" -eq 1
              grep -q "caller account leaked across profile selection" /proof/regression-old.log
              grep -q "launched Claude config_dir=" /proof/regression-old.log
              ! grep -q "build failed" /proof/regression-old.log
            '
      - name: Reproduce with real binary in offline container
        run: |
          image=$(docker image inspect agentdeck-cross-profile --format '{{.Id}}')
          set +e
          python3 skills/deck-repro/scripts/run.py --image "$image" --binary proof/agent-deck-old \
            --script .verification/repro.sh --fixtures .verification/fixtures --out proof/repro-old --timeout 120
          rc=$?
          set -e
          cat proof/repro-old/output.log
          test "$rc" -eq 1
          grep -q 'ORACLE: cross-profile launch inherited caller account' proof/repro-old/output.log
          sha256sum proof/agent-deck-old .verification/repro.sh .verification/fixtures/repro.py cmd/agent-deck/cross_profile_account_test.go
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-profile-baseline-proof
          path: |
            proof/*.log
            proof/*-exit.txt
            proof/repro-*/receipt.json
            proof/repro-*/output.log
            proof/repro-*/container.json
          retention-days: 7
