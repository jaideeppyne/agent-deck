name: Contributor socket-wait baseline (fork only)
on:
  push:
    branches: ['verify/socket-wait-peer-baseline']
permissions:
  contents: read
jobs:
  reproduce:
    if: github.repository == 'jaideeppyne/agent-deck'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build isolated image
        run: docker build -t socket-wait-proof -f .verification/Dockerfile .verification
      - name: Build exact baseline and observe tests-first behavior
        run: |
          mkdir -p proof fixtures
          cp .verification/fixtures/repro.py fixtures/
          docker run --rm --init --mount type=bind,src="$PWD",dst=/src,readonly \
            --mount type=bind,src="$PWD/proof",dst=/proof \
            --mount type=bind,src="$PWD/fixtures",dst=/fixtures \
            -e HOME=/tmp/home -e AGENTDECK_TEST_CONTAINER=1 \
            -e AGENTDECK_SKIP_UPDATE_CHECK=1 socket-wait-proof bash -c '
              set -eu
              mkdir -p "$HOME"
              cp -R /src /tmp/src
              cd /tmp/src
              git worktree add /tmp/base 036915808f43363ca9d54e77ce1fc0706b82029c
              git show fe30bb4242a9386dbfd37d3e0c064ef4765ff5a0:cmd/agent-deck/socket_wait_peer_test.go > /tmp/base/cmd/agent-deck/socket_wait_peer_test.go
              cd /tmp/base
              go version
              git rev-parse HEAD
              go vet ./...
              go build -o /proof/agent-deck-old ./cmd/agent-deck
              go test -c -o /fixtures/claude-helper ./cmd/agent-deck
              set +e
              go test -v -count=1 -run "^TestSessionSendSocketWaitPeerReply$" ./cmd/agent-deck > /proof/baseline.log 2>&1
              rc=$?
              set -e
              cat /proof/baseline.log
              test "$rc" -eq 1
              grep -q "turn identity not established" /proof/baseline.log
              ! grep -q "fixture launch failed\|did not publish\|did not receive\|build failed" /proof/baseline.log
            '
      - name: Reproduce against actual CLI in offline container
        run: |
          image=$(docker image inspect socket-wait-proof --format '{{.Id}}')
          set +e
          python3 skills/deck-repro/scripts/run.py --image "$image" --binary proof/agent-deck-old \
            --script .verification/repro.sh --fixtures fixtures --out proof/repro-old --timeout 120
          rc=$?
          set -e
          cat proof/repro-old/output.log
          test "$rc" -eq 1
          grep -q 'ORACLE: socket wait rejected a completed wrapped peer reply' proof/repro-old/output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: socket-wait-baseline
          path: |
            proof/baseline.log
            proof/repro-old/output.log
            proof/repro-old/receipt.json
            proof/repro-old/container.json
          retention-days: 7
